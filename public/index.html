        function toggleEditRecurring() {
            const on = document.getElementById('edit-recurring').checked;
            document.getElementById('edit-recur-fields').hidden = !on;
            const labelText = document.getElementById('edit-due-label-text');
            const labelNote = document.getElementById('edit-due-label-note');
            const dueInput  = document.getElementById('edit-due');
            if (labelText) {
                labelText.textContent = on ? 'Next due' : 'Due date';
            }
            if (labelNote) {
                labelNote.textContent = on ? '(optional)' : '';
            }
            // Swap the prefilled date to the relevant field's value when toggling.
            if (dueInput && modalItem) {
                if (on && !dueInput.value && modalItem.data.nextDue) {
                    dueInput.value = modalItem.data.nextDue;
                } else if (!on && !dueInput.value && modalItem.data.dueDate) {
                    dueInput.value = modalItem.data.dueDate;
                }
            }
        }

        // ── Save ──────────────────────────────────────────────────────────────

        async function saveEdit() {
            const { type, data } = modalItem;
            let body, url, successReload;

            if (type === 'task') {
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                const recurring = document.getElementById('edit-recurring').checked;
                const dateVal = document.getElementById('edit-due').value;
                body = {
                    id: data.id,
                    name,
                    // Recurring: send nextDue override (may be blank → backend auto-computes).
                    // One-off: send as dueDate.
                    dueDate: recurring ? '' : dateVal,
                    nextDue: recurring ? dateVal : '',
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                    priority: document.getElementById('edit-priority').value,
                    assignedTo: document.getElementById('edit-assigned-to').value,
                    recurring,
                    frequency: recurring ? (parseInt(document.getElementById('edit-frequency').value, 10) || 1) : '',
                    rate: recurring ? document.getElementById('edit-rate').value : '',
                    startTime: document.getElementById('edit-start-time')?.value || '',
                    endTime:   document.getElementById('edit-end-time')?.value   || '',
                };
                url = '/api/tasks';
                successReload = loadTasks;
            } else if (type === 'shopping') {
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                body = {
                    id: data.id,
                    name,
                    category: document.getElementById('edit-category').value,
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                };
                url = '/api/shopping';
                successReload = loadShopping;
            } else if (type === 'note') {
                const content = document.getElementById('edit-content').value.trim();
                if (!content) { alert('Note cannot be empty'); return; }
                body = {
                    id: data.id,
                    subject: document.getElementById('edit-subject').value.trim(),
                    content,
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                };
                url = '/api/notes';
                successReload = loadNotes;
            } else {
                // project
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                body = {
                    id: data.id,
                    name,
                    description: document.getElementById('edit-description').value.trim(),
                    shared: !document.getElementById('edit-private').checked,
                };
                url = '/api/projects';
                successReload = loadProjects;
            }

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (response.ok) {
                    closeModal();
                    await successReload();
                } else {
                    alert('Failed to save changes. Please try again.');
                }
            } catch (error) {
                alert('Error saving changes. Please try again.');
                console.error('Error:', error);
            }
        }

        // ── Delete from modal ─────────────────────────────────────────────────

        async function modalDelete() {
            const { type, data } = modalItem;

            // Projects have their own delete flow (tagged-items prompt).
            if (type === 'project') {
                closeModal();
                await deleteProject(data.id);
                return;
            }

            const label = type === 'note' ? 'note' : type === 'shopping' ? 'item' : 'task';
            if (!confirm(`Delete this ${label}?`)) return;

            try {
                const url = type === 'task' ? '/api/tasks' :
                            type === 'shopping' ? '/api/shopping' : '/api/notes';
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: data.id }),
                });

                if (response.ok) {
                    closeModal();
                    if (type === 'task') await loadTasks();
                    else if (type === 'shopping') await loadShopping();
                    else await loadNotes();
                } else {
                    alert('Failed to delete. Please try again.');
                }
            } catch (error) {
                alert('Error deleting. Please try again.');
                console.error('Error:', error);
            }
        }

        // ===== EVENT HANDLERS =====

        // ===== CALENDAR =====

        // ── Helpers ──────────────────────────────────────────────────────────

        // Colour class for a task pill / time block.
        function taskColourCls(t) {
            if (t.assignedTo === 'Thomas')       return 't-thomas';
            if (t.assignedTo === 'Gabriel')      return 't-gabriel';
            if (t.assignedTo === 'Both')         return 't-shared';
            if (t.recurring)                     return 't-recurring';
            if (t.shared)                        return 't-shared';
            return '';
        }

        // Build date→tasks map honouring project filter + overdue-recurring redirect.
        function buildTaskMap() {
            const today = todayStr();
            const map = {};
            tasks.forEach(task => {
                if (task.completed) return;
                let date = task.recurring ? task.nextDue : task.dueDate;
                if (!date) return;
                if (!matchesProjectFilter(task)) return;
                if (task.recurring && date < today) date = today;
                if (!map[date]) map[date] = [];
                map[date].push(task);
            });
            Object.values(map).forEach(arr =>
                arr.sort((a, b) => (parseInt(a.priority) || 99) - (parseInt(b.priority) || 99))
            );
            return map;
        }

        // ── Navigation ───────────────────────────────────────────────────────

        function prevMonth() {
            if (calendarMonth === 0) { calendarMonth = 11; calendarYear--; }
            else calendarMonth--;
            renderCalendar();
        }
        function nextMonth() {
            if (calendarMonth === 11) { calendarMonth = 0; calendarYear++; }
            else calendarMonth++;
            renderCalendar();
        }
        function prevWeek() {
            calendarWeekStart = new Date(calendarWeekStart);
            calendarWeekStart.setDate(calendarWeekStart.getDate() - 7);
            renderCalendar();
        }
        function nextWeek() {
            calendarWeekStart = new Date(calendarWeekStart);
            calendarWeekStart.setDate(calendarWeekStart.getDate() + 7);
            renderCalendar();
        }
        function prevPeriod() { calendarView === 'week' ? prevWeek() : prevMonth(); }
        function nextPeriod() { calendarView === 'week' ? nextWeek() : nextMonth(); }

        function switchCalendarView(v) {
            calendarView = v;
            document.querySelectorAll('.cal-view-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.view === v)
            );
            renderCalendar();
        }

        // ── Dispatcher ───────────────────────────────────────────────────────

        function renderCalendar() {
            if (calendarView === 'week') renderCalendarWeek();
            else renderCalendarMonth();
        }

        // ── Month view ───────────────────────────────────────────────────────

        function renderCalendarMonth() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl  = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;

            const today = todayStr();
            const monthNames = ['January','February','March','April','May','June',
                                'July','August','September','October','November','December'];
            titleEl.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;

            const taskMap = buildTaskMap();

            // Grid geometry — week starts Monday
            const daysInMonth   = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const firstDow      = new Date(calendarYear, calendarMonth, 1).getDay(); // 0=Sun
            const startPad      = (firstDow + 6) % 7; // Mon=0 … Sun=6
            const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();

            // Day-of-week headers
            const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = dayLabels.map(d => `<div class="cal-day-header">${d}</div>`).join('');

            // Leading padding from previous month
            for (let i = startPad - 1; i >= 0; i--) {
                html += `<div class="cal-day other-month"><span class="cal-day-num">${prevMonthDays - i}</span></div>`;
            }

            // Days of this month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr  = `${calendarYear}-${String(calendarMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday  = dateStr === today;
                const dayTasks = taskMap[dateStr] || [];
                const taskHtml = dayTasks.map(t =>
                    `<button class="cal-task ${taskColourCls(t)}" onclick="openModal('task',${t.id})">${escapeHtml(t.name)}</button>`
                ).join('');
                html += `<div class="cal-day${isToday ? ' today' : ''}"><span class="cal-day-num">${d}</span>${taskHtml}</div>`;
            }

            // Trailing padding to complete the last row
            const total    = startPad + daysInMonth;
            const trailing = (7 - (total % 7)) % 7;
            for (let d = 1; d <= trailing; d++) {
                html += `<div class="cal-day other-month"><span class="cal-day-num">${d}</span></div>`;
            }

            gridEl.className = 'calendar-grid';
            gridEl.innerHTML = html;
            renderIcons();
        }

        // ── Week view ────────────────────────────────────────────────────────

        function renderCalendarWeek() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl  = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;

            const today      = todayStr();
            const HOUR_START = 6;
            const HOUR_END   = 23;
            const HOUR_H     = 52; // px per hour
            const GRID_H     = (HOUR_END - HOUR_START) * HOUR_H;

            // Build the 7 days of this week (Mon → Sun)
            const days = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(calendarWeekStart);
                d.setDate(d.getDate() + i);
                return d;
            });

            // Title: "2–8 June 2026" or "30 June – 6 July 2026"
            const monthNames = ['January','February','March','April','May','June',
                                'July','August','September','October','November','December'];
            const s = days[0], e = days[6];
            titleEl.textContent = s.getMonth() === e.getMonth()
                ? `${s.getDate()}–${e.getDate()} ${monthNames[s.getMonth()]} ${s.getFullYear()}`
                : `${s.getDate()} ${monthNames[s.getMonth()]} – ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;

            const taskMap  = buildTaskMap();
            const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

            // Day header row
            let headHtml = `<div class="cal-wh-gutter"></div>`;
            days.forEach((d, i) => {
                const isToday = dateToStr(d) === today;
                headHtml += `<div class="cal-wh-day${isToday ? ' today' : ''}">${dayNames[i]}<b>${d.getDate()}</b></div>`;
            });

            // All-day row (tasks without a start time)
            let alldayHtml = `<div class="cal-allday-gutter">all day</div>`;
            days.forEach(d => {
                const dayTasks = (taskMap[dateToStr(d)] || []).filter(t => !t.startTime);
                alldayHtml += `<div class="cal-allday-col">${
                    dayTasks.map(t =>
                        `<button class="cal-task ${taskColourCls(t)}" onclick="openModal('task',${t.id})">${escapeHtml(t.name)}</button>`
                    ).join('')
                }</div>`;
            });

            // Time gutter labels (one per hour)
            let gutterHtml = '';
            for (let h = HOUR_START; h <= HOUR_END; h++) {
                gutterHtml += `<div class="cal-hour-label" style="top:${(h - HOUR_START) * HOUR_H}px">${String(h).padStart(2,'0')}</div>`;
            }

            // Day columns: hour lines + absolutely-positioned task blocks
            let colsHtml = '';
            days.forEach(d => {
                const ds        = dateToStr(d);
                const isToday   = ds === today;
                const timedTasks = (taskMap[ds] || []).filter(t => t.startTime);

                // Hour grid lines
                let linesHtml = '';
                for (let h = HOUR_START; h <= HOUR_END; h++) {
                    linesHtml += `<div class="cal-hour-line" style="top:${(h - HOUR_START) * HOUR_H}px"></div>`;
                }

                // Timed task blocks
                let blocksHtml = '';
                timedTasks.forEach(t => {
                    const [sh, sm] = t.startTime.split(':').map(Number);
                    const [eh, em] = t.endTime
                        ? t.endTime.split(':').map(Number)
                        : [sh + 1, sm]; // default 1-hour block if no end time
                    const topPx    = Math.max(0, (sh + sm / 60 - HOUR_START) * HOUR_H);
                    const heightPx = Math.max(18, ((eh + em / 60) - (sh + sm / 60)) * HOUR_H);
                    const clampTop = Math.min(topPx, GRID_H - 18);
                    blocksHtml += `<button class="cal-task cal-time-block ${taskColourCls(t)}"
                        style="top:${clampTop}px;height:${heightPx}px"
                        onclick="openModal('task',${t.id})">${escapeHtml(t.name)}</button>`;
                });

                colsHtml += `<div class="cal-week-day-body${isToday ? ' today' : ''}" style="height:${GRID_H}px">${linesHtml}${blocksHtml}</div>`;
            });

            gridEl.className = 'cal-week-container';
            gridEl.innerHTML = `
                <div class="cal-week-head">${headHtml}</div>
                <div class="cal-week-allday">${alldayHtml}</div>
                <div class="cal-week-body">
                    <div class="cal-week-gutter" style="height:${GRID_H}px">${gutterHtml}</div>
                    ${colsHtml}
                </div>`;
            renderIcons();
        }

        // Tab navigation
        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => {
                showSection(btn.dataset.section);
            });
        });

        // Shopping sub-tabs
        document.querySelectorAll('.sub-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                activeShoppingCategory = btn.dataset.category;
                renderShopping();
            });
        });

        // (Add forms are now rendered dynamically inside the modal — see openAddModal / renderAddForm)

        // ===== INIT =====
        initializeUI();
        // Initialise all static Lucide icons in the HTML shell
        // (tabs, refresh btn, add/delete buttons, modal close).
        renderIcons();
    </script>
    <script>
        // Register service worker — required for Android Chrome PWA standalone mode
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
