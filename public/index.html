        // ── Save ──────────────────────────────────────────────────────────────

        async function saveEdit() {
            const { type, data } = modalItem;
            let body, url, successReload;

            if (type === 'task') {
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                const recurring = document.getElementById('edit-recurring').checked;
                const dateVal = document.getElementById('edit-due').value;
                body = {
                    id: data.id,
                    name,
                    // Recurring: send nextDue override (may be blank → backend auto-computes).
                    // One-off: send as dueDate.
                    dueDate: recurring ? '' : dateVal,
                    nextDue: recurring ? dateVal : '',
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                    priority: document.getElementById('edit-priority').value,
                    assignedTo: document.getElementById('edit-assigned-to').value,
                    recurring,
                    frequency: recurring ? (parseInt(document.getElementById('edit-frequency').value, 10) || 1) : '',
                    rate: recurring ? document.getElementById('edit-rate').value : '',
                    startTime: document.getElementById('edit-start-time')?.value || '',
                    endTime:   document.getElementById('edit-end-time')?.value   || '',
                };
                url = '/api/tasks';
                successReload = loadTasks;
            } else if (type === 'shopping') {
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                body = {
                    id: data.id,
                    name,
                    category: document.getElementById('edit-category').value,
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                };
                url = '/api/shopping';
                successReload = loadShopping;
            } else if (type === 'note') {
                const content = document.getElementById('edit-content').value.trim();
                if (!content) { alert('Note cannot be empty'); return; }
                body = {
                    id: data.id,
                    subject: document.getElementById('edit-subject').value.trim(),
                    content,
                    shared: !document.getElementById('edit-private').checked,
                    project: document.getElementById('edit-project').value,
                };
                url = '/api/notes';
                successReload = loadNotes;
            } else {
                // project
                const name = document.getElementById('edit-name').value.trim();
                if (!name) { alert('Name is required'); return; }
                body = {
                    id: data.id,
                    name,
                    description: document.getElementById('edit-description').value.trim(),
                    shared: !document.getElementById('edit-private').checked,
                };
                url = '/api/projects';
                successReload = loadProjects;
            }

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (response.ok) {
                    closeModal();
                    await successReload();
                } else {
                    alert('Failed to save changes. Please try again.');
                }
            } catch (error) {
                alert('Error saving changes. Please try again.');
                console.error('Error:', error);
            }
        }

        // ── Delete from modal ─────────────────────────────────────────────────

        async function modalDelete() {
            const { type, data } = modalItem;

            // Projects have their own delete flow (tagged-items prompt).
            if (type === 'project') {
                closeModal();
                await deleteProject(data.id);
                return;
            }

            const label = type === 'note' ? 'note' : type === 'shopping' ? 'item' : 'task';
            if (!confirm(`Delete this ${label}?`)) return;

            try {
                const url = type === 'task' ? '/api/tasks' :
                            type === 'shopping' ? '/api/shopping' : '/api/notes';
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: data.id }),
                });

                if (response.ok) {
                    closeModal();
                    if (type === 'task') await loadTasks();
                    else if (type === 'shopping') await loadShopping();
                    else await loadNotes();
                } else {
                    alert('Failed to delete. Please try again.');
                }
            } catch (error) {
                alert('Error deleting. Please try again.');
                console.error('Error:', error);
            }
        }

        // ===== CALENDAR =====

        // ── Helpers ──────────────────────────────────────────────────────────

        // Colour class for a task pill / time block.
        function taskColourCls(t) {
            if (t.assignedTo === 'Thomas')       return 't-thomas';
            if (t.assignedTo === 'Gabriel')      return 't-gabriel';
            if (t.assignedTo === 'Both')         return 't-shared';
            if (t.recurring)                     return 't-recurring';
            if (t.shared)                        return 't-shared';
            return '';
        }

        // Build date→tasks map honouring project filter + overdue-recurring redirect.
        function buildTaskMap() {
            const today = todayStr();
            const map = {};
            tasks.forEach(task => {
                if (task.completed) return;
                let date = task.recurring ? task.nextDue : task.dueDate;
                if (!date) return;
                if (!matchesProjectFilter(task)) return;
                if (task.recurring && date < today) date = today;
                if (!map[date]) map[date] = [];
                map[date].push(task);
            });
            Object.values(map).forEach(arr =>
                arr.sort((a, b) => (parseInt(a.priority) || 99) - (parseInt(b.priority) || 99))
            );
            return map;
        }

        // ── Navigation ───────────────────────────────────────────────────────

        function prevMonth() {
            if (calendarMonth === 0) { calendarMonth = 11; calendarYear--; }
            else calendarMonth--;
            renderCalendar();
        }
        function nextMonth() {
            if (calendarMonth === 11) { calendarMonth = 0; calendarYear++; }
            else calendarMonth++;
            renderCalendar();
        }
        function prevWeek() {
            calendarWeekStart = new Date(calendarWeekStart);
            calendarWeekStart.setDate(calendarWeekStart.getDate() - 7);
            renderCalendar();
        }
        function nextWeek() {
            calendarWeekStart = new Date(calendarWeekStart);
            calendarWeekStart.setDate(calendarWeekStart.getDate() + 7);
            renderCalendar();
        }
        function prevPeriod() { calendarView === 'week' ? prevWeek() : prevMonth(); }
        function nextPeriod() { calendarView === 'week' ? nextWeek() : nextMonth(); }

        function switchCalendarView(v) {
            calendarView = v;
            document.querySelectorAll('.cal-view-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.view === v)
            );
            // Hide ← → nav when in Schedules view (no pagination needed)
            document.querySelectorAll('.calendar-nav-btn').forEach(b =>
                b.style.visibility = v === 'schedules' ? 'hidden' : ''
            );
            renderCalendar();
        }

        // ── Dispatcher ───────────────────────────────────────────────────────

        function renderCalendar() {
            if (calendarView === 'week')      renderCalendarWeek();
            else if (calendarView === 'schedules') renderSchedulesList();
            else                              renderCalendarMonth();
        }

        // ── Month view ───────────────────────────────────────────────────────

        function renderCalendarMonth() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl  = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;

            const today = todayStr();
            const monthNames = ['January','February','March','April','May','June',
                                'July','August','September','October','November','December'];
            titleEl.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;

            const taskMap = buildTaskMap();

            // Grid geometry — week starts Monday
            const daysInMonth   = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const firstDow      = new Date(calendarYear, calendarMonth, 1).getDay(); // 0=Sun
            const startPad      = (firstDow + 6) % 7; // Mon=0 … Sun=6
            const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();

            // Day-of-week headers
            const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = dayLabels.map(d => `<div class="cal-day-header">${d}</div>`).join('');

            // Leading padding from previous month
            for (let i = startPad - 1; i >= 0; i--) {
                html += `<div class="cal-day other-month"><span class="cal-day-num">${prevMonthDays - i}</span></div>`;
            }

            // Days of this month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr  = `${calendarYear}-${String(calendarMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday  = dateStr === today;
                // Schedule blocks first (bold/priority), then tasks
                const schedBlocks = getScheduleBlocks(dateStr);
                const schedHtml   = schedBlocks.map(s =>
                    `<button class="cal-task is-schedule ${scheduleColourCls(s)}" onclick="event.stopPropagation();openScheduleModal(${s.id},'${dateStr}')">${escapeHtml(s.name)}</button>`
                ).join('');
                const dayTasks = taskMap[dateStr] || [];
                const taskHtml = dayTasks.map(t =>
                    `<button class="cal-task ${taskColourCls(t)}" onclick="event.stopPropagation();openModal('task',${t.id})">${escapeHtml(t.name)}</button>`
                ).join('');
                const bdayHtml = getBirthdaysForDate(dateStr).map(b =>
                    `<div class="cal-task t-birthday">${ic('cake')} ${escapeHtml(b.name)}</div>`
                ).join('');
                const specHtml = getSpecialDaysForDate(dateStr).map(s =>
                    `<div class="cal-task t-special-day">${escapeHtml(s.name)}</div>`
                ).join('');
                html += `<div class="cal-day${isToday ? ' today' : ''}" onclick="openDayView('${dateStr}')"><span class="cal-day-num">${d}</span>${bdayHtml}${specHtml}${schedHtml}${taskHtml}</div>`;
            }

            // Trailing padding to complete the last row
            const total    = startPad + daysInMonth;
            const trailing = (7 - (total % 7)) % 7;
            for (let d = 1; d <= trailing; d++) {
                html += `<div class="cal-day other-month"><span class="cal-day-num">${d}</span></div>`;
            }

            gridEl.className = 'calendar-grid';
            gridEl.innerHTML = html;
            renderIcons();
        }

        // ── Week view ────────────────────────────────────────────────────────

        function renderCalendarWeek() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl  = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;

            const today      = todayStr();
            const HOUR_START = 0;
            const HOUR_END   = 23;
            const HOUR_H     = 52; // px per hour
            const GRID_H     = (HOUR_END - HOUR_START + 1) * HOUR_H;

            // Build the 7 days of this week (Mon → Sun)
            const days = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(calendarWeekStart);
                d.setDate(d.getDate() + i);
                return d;
            });

            // Title: "2–8 June 2026" or "30 June – 6 July 2026"
            const monthNames = ['January','February','March','April','May','June',
                                'July','August','September','October','November','December'];
            const s = days[0], e = days[6];
            titleEl.textContent = s.getMonth() === e.getMonth()
                ? `${s.getDate()}–${e.getDate()} ${monthNames[s.getMonth()]} ${s.getFullYear()}`
                : `${s.getDate()} ${monthNames[s.getMonth()]} – ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;

            const taskMap  = buildTaskMap();
            const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

            // Day header row
            let headHtml = `<div class="cal-wh-gutter"></div>`;
            days.forEach((d, i) => {
                const isToday = dateToStr(d) === today;
                headHtml += `<div class="cal-wh-day${isToday ? ' today' : ''}">${dayNames[i]}<b>${d.getDate()}</b></div>`;
            });

            // All-day row (schedule blocks without a start time + untimed tasks)
            let alldayHtml = `<div class="cal-allday-gutter"></div>`;
            days.forEach(d => {
                const ds = dateToStr(d);
                const schedAllday = getScheduleBlocks(ds).filter(s => !s.startTime);
                const dayTasks    = (taskMap[ds] || []).filter(t => !t.startTime);
                const bdayItems   = getBirthdaysForDate(ds);
                const specItems   = getSpecialDaysForDate(ds);
                alldayHtml += `<div class="cal-allday-col">${
                    bdayItems.map(b =>
                        `<div class="cal-task t-birthday">${ic('cake')} ${escapeHtml(b.name)}</div>`
                    ).join('') +
                    specItems.map(s =>
                        `<div class="cal-task t-special-day">${escapeHtml(s.name)}</div>`
                    ).join('') +
                    schedAllday.map(s =>
                        `<button class="cal-task is-schedule ${scheduleColourCls(s)}" onclick="openScheduleModal(${s.id},'${ds}')">${escapeHtml(s.name)}</button>`
                    ).join('') +
                    dayTasks.map(t =>
                        `<button class="cal-task ${taskColourCls(t)}" onclick="openModal('task',${t.id})">${escapeHtml(t.name)}</button>`
                    ).join('')
                }</div>`;
            });

            // Time gutter labels (one per hour)
            let gutterHtml = '';
            for (let h = HOUR_START; h <= HOUR_END + 1; h++) {
                const topPx = (h - HOUR_START) * HOUR_H;
                const xform = h === HOUR_END + 1 ? 'translateY(calc(-100% - 1px))' : '';
                gutterHtml += `<div class="cal-hour-label" style="top:${topPx}px${xform ? ';transform:' + xform : ''}">${String(h).padStart(2,'0')}</div>`;
            }

            // Day columns: hour lines + absolutely-positioned task blocks
            let colsHtml = '';
            days.forEach(d => {
                const ds        = dateToStr(d);
                const isToday   = ds === today;
                const timedTasks = (taskMap[ds] || []).filter(t => t.startTime);

                // Hour grid lines (bottom closing line comes from border-bottom on .cal-week-day-body)
                let linesHtml = '';
                for (let h = HOUR_START; h <= HOUR_END; h++) {
                    linesHtml += `<div class="cal-hour-line" style="top:${(h - HOUR_START) * HOUR_H}px"></div>`;
                }

                // Timed task blocks
                let blocksHtml = '';
                timedTasks.forEach(t => {
                    const [sh, sm] = t.startTime.split(':').map(Number);
                    const [eh, em] = t.endTime
                        ? t.endTime.split(':').map(Number)
                        : [sh + 1, sm]; // default 1-hour block if no end time
                    const topPx    = Math.max(0, (sh + sm / 60 - HOUR_START) * HOUR_H);
                    const heightPx = Math.max(18, ((eh + em / 60) - (sh + sm / 60)) * HOUR_H);
                    const clampTop = Math.min(topPx, GRID_H - 18);
                    blocksHtml += `<button class="cal-task cal-time-block ${taskColourCls(t)}"
                        style="top:${clampTop}px;height:${heightPx}px"
                        onclick="openModal('task',${t.id})">${escapeHtml(t.name)}</button>`;
                });

                // Timed schedule blocks (rendered on top of task blocks, same column)
                getScheduleBlocks(ds).filter(s => s.startTime).forEach(s => {
                    const [sh, sm] = s.startTime.split(':').map(Number);
                    const [eh, em] = s.endTime ? s.endTime.split(':').map(Number) : [sh + 1, sm];
                    const topPx    = Math.max(0, (sh + sm / 60 - HOUR_START) * HOUR_H);
                    const heightPx = Math.max(18, ((eh + em / 60) - (sh + sm / 60)) * HOUR_H);
                    blocksHtml += `<button class="cal-task cal-time-block is-schedule ${scheduleColourCls(s)}"
                        style="top:${Math.min(topPx, GRID_H - 18)}px;height:${heightPx}px"
                        onclick="openScheduleModal(${s.id},'${ds}')">${escapeHtml(s.name)}</button>`;
                });

                colsHtml += `<div class="cal-week-day-body${isToday ? ' today' : ''}" style="height:${GRID_H}px">${linesHtml}${blocksHtml}</div>`;
            });

            gridEl.className = 'cal-week-container';
            gridEl.innerHTML = `
                <div class="cal-week-head">${headHtml}</div>
                <div class="cal-week-allday">${alldayHtml}</div>
                <div class="cal-week-body">
                    <div class="cal-week-gutter" style="height:${GRID_H}px">${gutterHtml}</div>
                    ${colsHtml}
                </div>`;
            renderIcons();
        }

        // ===== SCHEDULES =====

        // ── Data helpers ─────────────────────────────────────────────────────

        async function loadSchedules() {
            try {
                const res = await fetch(`/api/schedules?user=${encodeURIComponent(currentUser)}`);
                const data = await res.json();
                schedules       = data.schedules  || [];
                scheduleOverrides = data.overrides || [];
                schedulesLoaded = true;
                if (activeSection === 'calendar') renderCalendar();
            } catch (e) {
                console.error('Error loading schedules:', e);
            }
        }

        async function loadSpecials() {
            try {
                const res = await fetch(`/api/specials?user=${encodeURIComponent(currentUser)}`);
                const data = await res.json();
                // Visibility: shared items visible to everyone; private items only to their owner.
                // Items with no owner (created before owner tracking) are treated as shared.
                const canSee = item => item.shared || !item.owner || item.owner === currentUser;
                birthdays   = (data.birthdays   || []).filter(canSee);
                specialDays = (data.specialDays || []).filter(canSee);
                specialsLoaded = true;
                if (activeSection === 'calendar') renderCalendar();
            } catch (e) {
                console.error('Error loading specials:', e);
            }
        }

        // Returns all birthdays that fall on the given dateStr (YYYY-MM-DD).
        // Compares only MM-DD portion since birthdays recur every year.
        function getBirthdaysForDate(dateStr) {
            const parts = dateStr.split('-');
            const md = `${parts[1]}-${parts[2]}`;
            return birthdays.filter(b => b.date === md);
        }

        // Returns all special days that fall on the given dateStr (YYYY-MM-DD).
        // Recurring special days compare only MM-DD; one-time compare full date.
        function getSpecialDaysForDate(dateStr) {
            const parts = dateStr.split('-');
            const md = `${parts[1]}-${parts[2]}`;
            return specialDays.filter(s =>
                s.recurring ? s.date === md : s.date === dateStr
            );
        }

        // Returns true if schedule series produces an occurrence on dateStr (YYYY-MM-DD).
        function isOccurrence(sched, dateStr) {
            if (!sched.seriesStart || dateStr < sched.seriesStart) return false;
            if (sched.seriesEnd && dateStr > sched.seriesEnd) return false;
            const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
            const diffDays = Math.round((parseD(dateStr) - parseD(sched.seriesStart)) / 86400000);
            if (diffDays < 0) return false;
            const freq = parseInt(sched.frequency) || 1;
            if (sched.rate === 'days')   return diffDays % freq === 0;
            if (sched.rate === 'weeks')  return diffDays % (freq * 7) === 0;
            if (sched.rate === 'months') {
                const [sy,sm,sd] = sched.seriesStart.split('-').map(Number);
                const [dy,dm,dd] = dateStr.split('-').map(Number);
                if (dd !== sd) return false;
                const mDiff = (dy - sy) * 12 + (dm - sm);
                return mDiff >= 0 && mDiff % freq === 0;
            }
            return false;
        }

        // Returns all schedule blocks that fall on dateStr, with overrides applied.
        function getScheduleBlocks(dateStr) {
            const blocks = [];
            schedules.forEach(s => {
                if (!isOccurrence(s, dateStr)) return;
                if (!matchesProjectFilter(s)) return; // honour active project filter
                const ov = scheduleOverrides.find(o => String(o.scheduleId) === String(s.id) && o.originalDate === dateStr);
                if (ov) {
                    if (ov.overrideType === 'cancelled') return;
                    if (ov.overrideType === 'modified') {
                        blocks.push({ ...s, startTime: ov.newStartTime || s.startTime, endTime: ov.newEndTime || s.endTime, isOverridden: true, overrideId: ov.id, originalDate: dateStr });
                        return;
                    }
                }
                blocks.push({ ...s, originalDate: dateStr });
            });
            return blocks;
        }

        function scheduleColourCls(s) {
            if (s.assignedTo === 'Thomas')  return 't-thomas';
            if (s.assignedTo === 'Gabriel') return 't-gabriel';
            if (s.assignedTo === 'Both')    return 't-shared';
            return 't-recurring';
        }

        // ── Schedules list view (calendarView === 'schedules') ───────────────

        // Format a MM-DD date string as e.g. "Jun 15"
        function formatMonthDay(md) {
            const parts = md.split('-');
            if (parts.length !== 2) return md;
            const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${monthNames[parseInt(parts[0]) - 1]} ${parseInt(parts[1])}`;
        }

        function toggleEventsSection(key) {
            eventsCollapsed[key] = !eventsCollapsed[key];
            renderSchedulesList();
        }

        function renderSchedulesList() {
            const titleEl = document.getElementById('calendar-month-title');
            const gridEl  = document.getElementById('calendar-grid');
            if (!titleEl || !gridEl) return;
            titleEl.textContent = 'Events';
            gridEl.className    = '';

            // Helper: clickable section header with collapse chevron
            const sectionLabel = (key, text, count) => {
                const collapsed = eventsCollapsed[key];
                const countBadge = count > 0 ? ` <span style="font-weight:400;font-size:10px;background:#e0e0e0;border-radius:10px;padding:0 6px;margin-left:4px">${count}</span>` : '';
                return `<div onclick="toggleEventsSection('${key}')"
                    style="font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.06em;
                           margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">
                    <span>${text}${countBadge}</span>
                    ${ic(collapsed ? 'chevron-right' : 'chevron-down')}
                </div>`;
            };

            // ── Schedule blocks (apply project filter) ──
            const visibleSchedules = activeProjectFilter === 'all'
                ? schedules
                : schedules.filter(s => matchesProjectFilter(s));
            const schedAddBtn = `<button class="add-toggle-btn" onclick="openAddModal('schedules')" style="margin-bottom:8px">${ic('plus')} Add Schedule</button>`;
            const schedItemsHtml = visibleSchedules.length === 0
                ? `<div class="empty-state" style="margin-bottom:12px">${schedules.length === 0 ? 'No schedules yet.' : 'No schedules in this project.'}</div>`
                : visibleSchedules.map(s => {
                    const freq = parseInt(s.frequency) || 1;
                    const unit = freq === 1 ? s.rate.replace(/s$/, '') : s.rate;
                    const timeStr = s.endTime ? `${s.startTime}–${s.endTime}` : s.startTime;
                    const privacyTag = !s.shared ? ' ' + ic('lock') : '';
                    const isOneTime = !!(s.seriesEnd && s.seriesEnd === s.seriesStart);
                    const recurStr  = isOneTime ? `Once · ${s.seriesStart}` : `Every ${freq} ${unit}`;
                    return `<div class="item">
                        <div class="item-content">
                            <button class="item-name-btn" onclick="openScheduleSeriesModal(${s.id})">${escapeHtml(s.name)}${privacyTag}</button>
                            <div class="item-meta">${timeStr} · ${recurStr}${s.assignedTo ? ' · ' + s.assignedTo : ''}</div>
                        </div>
                    </div>`;
                }).join('');

            // ── Birthdays ──
            const bdayAddBtn = `<button class="add-toggle-btn" onclick="openAddModal('birthdays')" style="margin-bottom:8px">${ic('plus')} Add Birthday</button>`;
            const bdayItemsHtml = birthdays.length === 0
                ? '<div class="empty-state" style="margin-bottom:12px">No birthdays yet.</div>'
                : birthdays.map(b => {
                    const dateLabel  = b.date ? formatMonthDay(b.date) : '—';
                    const privacyTag = !b.shared ? ' ' + ic('lock') : '';
                    return `<div class="item">
                        <div class="item-content">
                            <button class="item-name-btn" onclick="openEditBirthday(${b.id})">${escapeHtml(b.name)}${privacyTag}</button>
                            <div class="item-meta">${dateLabel}${b.notes ? ' · ' + escapeHtml(b.notes) : ''}</div>
                        </div>
                        <button onclick="deleteBirthday(${b.id})" title="Delete"
                            style="background:none;border:none;cursor:pointer;color:#dc2626;padding:4px 8px;border-radius:6px;font-size:13px">${ic('trash-2')}</button>
                    </div>`;
                }).join('');

            // ── Special Days / Holidays ──
            const specAddBtn = `<button class="add-toggle-btn" onclick="openAddModal('special-days')" style="margin-bottom:8px">${ic('plus')} Add Holiday / Red Day</button>`;
            const specItemsHtml = specialDays.length === 0
                ? '<div class="empty-state" style="margin-bottom:12px">No special days yet.</div>'
                : specialDays.map(s => {
                    const isRecurring = s.recurring === true || s.recurring === 'true';
                    const dateLabel   = isRecurring ? formatMonthDay(s.date) + ' (annual)' : s.date;
                    const privacyTag  = !s.shared ? ' ' + ic('lock') : '';
                    return `<div class="item">
                        <div class="item-content">
                            <button class="item-name-btn" onclick="openEditSpecialDay(${s.id})">${escapeHtml(s.name)}${privacyTag}</button>
                            <div class="item-meta">${dateLabel}${s.notes ? ' · ' + escapeHtml(s.notes) : ''}</div>
                        </div>
                        <button onclick="deleteSpecialDay(${s.id})" title="Delete"
                            style="background:none;border:none;cursor:pointer;color:#dc2626;padding:4px 8px;border-radius:6px;font-size:13px">${ic('trash-2')}</button>
                    </div>`;
                }).join('');

            const wrap = (key, content) =>
                eventsCollapsed[key] ? '' : content;

            gridEl.innerHTML =
                sectionLabel('schedules', 'Schedule Blocks', visibleSchedules.length) +
                wrap('schedules', schedAddBtn + schedItemsHtml) +
                sectionLabel('birthdays', 'Birthdays', birthdays.length) +
                wrap('birthdays', bdayAddBtn + bdayItemsHtml) +
                sectionLabel('holidays', 'Holidays & Red Days', specialDays.length) +
                wrap('holidays', specAddBtn + specItemsHtml);

            renderIcons();
        }

        // ── Add schedule ─────────────────────────────────────────────────────

        async function addSchedule() {
            const name       = (document.getElementById('sched-name')?.value || '').trim();
            const assignedTo = document.getElementById('sched-assigned-to')?.value || '';
            const startTime  = document.getElementById('sched-start-time')?.value || '';
            const endTime    = document.getElementById('sched-end-time')?.value || '';
            const project    = document.getElementById('sched-project')?.value || '';
            const shared     = !(document.getElementById('sched-private')?.checked);
            const oneTime    = document.getElementById('sched-onetime')?.checked;

            // One-time block uses a single date; recurring uses series start/end + interval
            let frequency, rate, seriesStart, seriesEnd;
            if (oneTime) {
                seriesStart = seriesEnd = document.getElementById('sched-onetime-date')?.value || '';
                frequency = 1; rate = 'weeks'; // stored but irrelevant for one-time
            } else {
                frequency   = parseInt(document.getElementById('sched-frequency')?.value) || 1;
                rate        = document.getElementById('sched-rate')?.value || 'weeks';
                seriesStart = document.getElementById('sched-series-start')?.value || '';
                seriesEnd   = document.getElementById('sched-series-end')?.value || '';
            }

            if (!name)        { alert('Name is required'); return; }
            if (!startTime)   { alert('Start time is required'); return; }
            if (!endTime)     { alert('End time is required'); return; }
            if (!seriesStart) { alert(oneTime ? 'Date is required' : 'Starting date is required'); return; }

            try {
                const res = await fetch('/api/schedules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'schedule', name, owner: currentUser, shared, assignedTo, project, startTime, endTime, frequency, rate, seriesStart, seriesEnd }),
                });
                if (res.ok) { closeModal(); await loadSchedules(); }
                else alert('Failed to add schedule');
            } catch (e) { alert('Error adding schedule'); console.error(e); }
        }

        // ── Open schedule modal (from calendar block) ────────────────────────

        function openScheduleModal(scheduleId, dateStr) {
            const sched = schedules.find(s => s.id == scheduleId);
            if (!sched) return;
            const ov = scheduleOverrides.find(o => String(o.scheduleId) === String(sched.id) && o.originalDate === dateStr);
            const display = (ov && ov.overrideType === 'modified')
                ? { ...sched, startTime: ov.newStartTime || sched.startTime, endTime: ov.newEndTime || sched.endTime }
                : sched;
            modalSchedule = { schedule: sched, dateStr, override: ov || null };

            const freq = parseInt(sched.frequency) || 1;
            const unit = freq === 1 ? sched.rate.replace(/s$/, '') : sched.rate;
            const isOneTime = !!(sched.seriesEnd && sched.seriesEnd === sched.seriesStart);
            const rows = [
                ['Name',  escapeHtml(display.name)],
                ['Date',  dateStr],
                ['Time',  `${display.startTime} – ${display.endTime}`],
            ];
            if (isOneTime) rows.push(['Type', 'One-time block']);
            else           rows.push(['Repeat', `Every ${freq} ${unit}`]);
            if (display.assignedTo) rows.push(['Assigned to', display.assignedTo]);
            if (display.project)    rows.push(['Project', projectName(display.project) || '—']);
            if (ov && ov.overrideType === 'modified') rows.push(['Note', 'This occurrence has been modified']);

            _openScheduleModalCommon(rows, true);
        }

        // Open schedule modal from Schedules list (series-level only, no instance actions)
        function openScheduleSeriesModal(scheduleId) {
            const sched = schedules.find(s => s.id == scheduleId);
            if (!sched) return;
            modalSchedule = { schedule: sched, dateStr: null, override: null };

            const freq = parseInt(sched.frequency) || 1;
            const unit = freq === 1 ? sched.rate.replace(/s$/, '') : sched.rate;
            const isOneTime = !!(sched.seriesEnd && sched.seriesEnd === sched.seriesStart);
            const rows = [
                ['Name',  escapeHtml(sched.name)],
                ['Time',  `${sched.startTime} – ${sched.endTime}`],
            ];
            if (isOneTime) {
                rows.push(['Type', 'One-time block']);
                rows.push(['Date', sched.seriesStart]);
            } else {
                rows.push(['Repeat', `Every ${freq} ${unit}`]);
                rows.push(['Starts', sched.seriesStart]);
                if (sched.seriesEnd) rows.push(['Ends', sched.seriesEnd]);
            }
            if (sched.assignedTo) rows.push(['Assigned to', sched.assignedTo]);
            if (sched.project)    rows.push(['Project', projectName(sched.project) || '—']);

            _openScheduleModalCommon(rows, false);
        }

        function _openScheduleModalCommon(rows, showInstanceActions) {
            document.getElementById('modal-schedule-rows').innerHTML = rows.map(([label, value]) =>
                `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value}</span></div>`
            ).join('');
            document.getElementById('modal-sched-instance-actions').hidden = !showInstanceActions;
            document.getElementById('modal-title').textContent = 'Schedule';
            document.getElementById('modal-detail').hidden   = true;
            document.getElementById('modal-edit').hidden     = true;

            document.getElementById('modal-day').hidden      = true;
            document.getElementById('modal-schedule').hidden = false;
            document.getElementById('modal-overlay').classList.add('open');
            renderIcons();
        }

        async function saveScheduleFromHere() {
            if (!modalSchedule) return;
            const { schedule, dateStr } = modalSchedule;
            const name       = (document.getElementById('sched-edit-name')?.value || '').trim();
            const assignedTo = document.getElementById('sched-edit-assigned-to')?.value || '';
            const newStart   = document.getElementById('sched-edit-start')?.value || '';
            const newEnd     = document.getElementById('sched-edit-end')?.value   || '';
            const frequency  = parseInt(document.getElementById('sched-edit-freq')?.value) || 1;
            const rate       = document.getElementById('sched-edit-rate')?.value  || 'weeks';
            if (!name) { alert('Name is required'); return; }

            // Compute the day before this occurrence
            const [dy, dm, dd] = dateStr.split('-').map(Number);
            const dayBefore = new Date(dy, dm-1, dd);
            dayBefore.setDate(dayBefore.getDate() - 1);
            const dayBeforeStr = dateToStr(dayBefore);

            try {
                // If this IS the series start, just edit the series directly (no split)
                if (dateStr <= schedule.seriesStart) {
                    await fetch('/api/schedules', {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ resource: 'schedule', id: schedule.id, name, assignedTo, startTime: newStart, endTime: newEnd, frequency, rate }),
                    });
                } else {
                    // End the old series the day before, start a new series from here
                    await fetch('/api/schedules', {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ resource: 'schedule', id: schedule.id, seriesEnd: dayBeforeStr }),
                    });
                    await fetch('/api/schedules', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ resource: 'schedule', name, owner: schedule.owner, shared: schedule.shared, assignedTo, project: schedule.project, startTime: newStart, endTime: newEnd, frequency, rate, seriesStart: dateStr, seriesEnd: '' }),
                    });
                }
                closeModal(); await loadSchedules();
            } catch (e) { alert('Error saving'); console.error(e); }
        }

            let date;
            if (recurring) {
                const month = document.getElementById('spec-annual-month')?.value || '';
                const day   = document.getElementById('spec-annual-day')?.value   || '';
                if (!month || !day) { alert('Month and day are required'); return; }
                date = `${month}-${day}`;
            } else {
                date = document.getElementById('spec-onetime-date')?.value || '';
                if (!date) { alert('Date is required'); return; }
            }
            try {
                const res = await fetch('/api/specials', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'special-day', name, date, recurring, owner: currentUser, shared, notes }),
                });
                if (res.ok) { closeModal(); await loadSpecials(); }
                else alert('Failed to add special day');
            } catch (e) { alert('Error saving'); console.error(e); }
        }

        async function deleteBirthday(id) {
            if (!confirm('Delete this birthday?')) return;
            try {
                const res = await fetch('/api/specials', {
                    method: 'DELETE', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'birthday', id }),
                });
                if (res.ok) await loadSpecials();
                else alert('Failed to delete');
            } catch (e) { alert('Error deleting'); console.error(e); }
        }

        async function deleteSpecialDay(id) {
            if (!confirm('Delete this special day?')) return;
            try {
                const res = await fetch('/api/specials', {
                    method: 'DELETE', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'special-day', id }),
                });
                if (res.ok) await loadSpecials();
                else alert('Failed to delete');
            } catch (e) { alert('Error deleting'); console.error(e); }
        }

        // ── Edit birthdays ────────────────────────────────────────────────────

        function openEditBirthday(id) {
            const b = birthdays.find(x => String(x.id) === String(id));
            if (!b) return;
            editingSpecial = { type: 'birthday', id };
            openAddModal('birthdays');
            document.getElementById('modal-title').textContent = 'Edit Birthday';
            document.getElementById('modal-add-submit-btn').textContent = 'Save';
            // Pre-fill: date input needs YYYY-MM-DD; store as MM-DD so use placeholder year 2000
            const nameEl    = document.getElementById('bday-name');
            const dateEl    = document.getElementById('bday-date');
            const notesEl   = document.getElementById('bday-notes');
            const privateEl = document.getElementById('bday-private');
            if (nameEl)    nameEl.value      = b.name;
            if (dateEl)    dateEl.value      = `2000-${b.date}`;
            if (notesEl)   notesEl.value     = b.notes || '';
            if (privateEl) privateEl.checked = !b.shared;
        }

        async function saveEditBirthday() {
            const name    = (document.getElementById('bday-name')?.value || '').trim();
            const dateVal = document.getElementById('bday-date')?.value || '';
            const notes   = (document.getElementById('bday-notes')?.value || '').trim();
            const shared  = !(document.getElementById('bday-private')?.checked);
            if (!name)    { alert('Name is required'); return; }
            if (!dateVal) { alert('Date is required'); return; }
            const parts = dateVal.split('-');
            const date  = `${parts[1]}-${parts[2]}`;
            const id    = editingSpecial.id;
            try {
                const res = await fetch('/api/specials', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'birthday', id, name, date, shared, notes }),
                });
                if (res.ok) { closeModal(); await loadSpecials(); }
                else alert('Failed to save');
            } catch (e) { alert('Error saving'); console.error(e); }
        }

        // ── Edit special days ─────────────────────────────────────────────────

        function openEditSpecialDay(id) {
            const s = specialDays.find(x => String(x.id) === String(id));
            if (!s) return;
            editingSpecial = { type: 'special-day', id };
            openAddModal('special-days');
            document.getElementById('modal-title').textContent = 'Edit Holiday / Red Day';
            document.getElementById('modal-add-submit-btn').textContent = 'Save';
            const nameEl    = document.getElementById('spec-name');
            const recurEl   = document.getElementById('spec-recurring');
            const notesEl   = document.getElementById('spec-notes');
            const privateEl = document.getElementById('spec-private');
            if (nameEl)    nameEl.value      = s.name;
            if (notesEl)   notesEl.value     = s.notes || '';
            if (privateEl) privateEl.checked = !s.shared;
            const isRecurring = s.recurring === true || s.recurring === 'true';
            if (recurEl) {
                recurEl.checked = isRecurring;
                toggleSpecRecurring();
            }
            if (isRecurring) {
                const parts   = s.date.split('-');
                const monthEl = document.getElementById('spec-annual-month');
                const dayEl   = document.getElementById('spec-annual-day');
                if (monthEl) monthEl.value = parts[0];
                if (dayEl)   dayEl.value   = parts[1];
            } else {
                const dateEl = document.getElementById('spec-onetime-date');
                if (dateEl) dateEl.value = s.date;
            }
        }

        async function saveEditSpecialDay() {
            const name      = (document.getElementById('spec-name')?.value || '').trim();
            const recurring = document.getElementById('spec-recurring')?.checked ?? true;
            const notes     = (document.getElementById('spec-notes')?.value || '').trim();
            const shared    = !(document.getElementById('spec-private')?.checked);
            if (!name) { alert('Name is required'); return; }
            let date;
            if (recurring) {
                const month = document.getElementById('spec-annual-month')?.value || '';
                const day   = document.getElementById('spec-annual-day')?.value   || '';
                if (!month || !day) { alert('Month and day are required'); return; }
                date = `${month}-${day}`;
            } else {
                date = document.getElementById('spec-onetime-date')?.value || '';
                if (!date) { alert('Date is required'); return; }
            }
            const id = editingSpecial.id;
            try {
                const res = await fetch('/api/specials', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resource: 'special-day', id, name, date, recurring, shared, notes }),
                });
                if (res.ok) { closeModal(); await loadSpecials(); }
                else alert('Failed to save');
            } catch (e) { alert('Error saving'); console.error(e); }
        }

        // Helper: switch modal to edit panel with custom save handler
        function _showScheduleEditPanel(saveFn) {
            document.getElementById('modal-schedule').hidden = true;
            document.getElementById('modal-edit').hidden     = false;
            const saveBtn   = document.querySelector('#modal-edit .modal-btn-primary');
            const cancelBtn = document.querySelector('#modal-edit .modal-btn-secondary');
            if (saveBtn)   saveBtn.onclick   = saveFn;
            if (cancelBtn) cancelBtn.onclick = () => {
                document.getElementById('modal-edit').hidden     = true;
                document.getElementById('modal-schedule').hidden = false;
            };
        }

        // Tab navigation
        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => {
                showSection(btn.dataset.section);
            });
        });

        // Shopping sub-tabs
        document.querySelectorAll('.sub-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                activeShoppingCategory = btn.dataset.category;
                renderShopping();
            });
        });

        // (Add forms are now rendered dynamically inside the modal — see openAddModal / renderAddForm)

        // ===== INIT =====
        initializeUI();
        // Initialise all static Lucide icons in the HTML shell
        // (tabs, refresh btn, add/delete buttons, modal close).
        renderIcons();
    </script>
    <script>
        // Register service worker — required for Android Chrome PWA standalone mode
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
</body>
