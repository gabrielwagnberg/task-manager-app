<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Task Manager Widget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:      #ffffff;
            --text:    #1a1a1a;
            --meta:    #999999;
            --accent:  #2563eb;
            --sched:   #7c3aed;
            --ok:      #16a34a;
            --border:  #f0f0f0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:     #1c1c1e;
                --text:   #f0f0f0;
                --meta:   #888888;
                --border: #2c2c2e;
            }
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            padding: 12px 14px;
            overflow: hidden;
            height: 100vh;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .app-name  { font-weight: 700; font-size: 13px; color: var(--text); }
        .date-str  { font-size: 11px; color: var(--meta); }

        .item {
            padding: 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }
        .item.sched { color: var(--sched); font-weight: 600; }
        .meta-txt   { color: var(--meta); font-size: 10px; margin-left: 4px; }
        .bullet     { color: var(--meta); margin-right: 3px; }

        .empty {
            color: var(--ok);
            font-weight: 500;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .more {
            color: var(--meta);
            font-size: 11px;
            margin-top: 4px;
        }
        .error { color: #dc2626; font-size: 11px; margin-top: 4px; }

        .footer {
            position: absolute;
            bottom: 10px;
            right: 14px;
            font-size: 10px;
            color: var(--meta);
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="app-name">Task Manager</span>
        <span class="date-str" id="date-str"></span>
    </div>
    <div id="content">Loading…</div>
    <div class="footer" id="user-label"></div>

    <script>
        // ── Config ────────────────────────────────────────────────────────────
        const params   = new URLSearchParams(location.search);
        const USER     = params.get('user') || 'Gabriel';
        const MAX_ROWS = parseInt(params.get('max') || '6');
        const BASE_URL = 'https://task-manager-app-iota-puce.vercel.app';
        const API      = BASE_URL + '/api';
        const OPEN_URL = BASE_URL + '?tab=calendar';

        document.getElementById('user-label').textContent = USER;
        document.body.onclick = () => window.location = OPEN_URL;

        // ── Date helpers ──────────────────────────────────────────────────────
        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function isOccurrence(s, dateStr) {
            if (!s.seriesStart || dateStr < s.seriesStart) return false;
            if (s.seriesEnd && dateStr > s.seriesEnd) return false;
            const pd = str => { const [y,m,d] = str.split('-').map(Number); return new Date(y,m-1,d); };
            const diff = Math.round((pd(dateStr) - pd(s.seriesStart)) / 86400000);
            if (diff < 0) return false;
            const f = parseInt(s.frequency) || 1;
            if (s.rate === 'days')  return diff % f === 0;
            if (s.rate === 'weeks') return diff % (f * 7) === 0;
            // months
            const st = pd(s.seriesStart), ch = pd(dateStr);
            const md = (ch.getFullYear() - st.getFullYear()) * 12 + ch.getMonth() - st.getMonth();
            return md % f === 0 && ch.getDate() === st.getDate();
        }

        // ── Render ────────────────────────────────────────────────────────────
        async function render() {
            const today = todayStr();

            document.getElementById('date-str').textContent =
                new Date().toLocaleDateString('sv-SE', { weekday:'short', day:'numeric', month:'short' });

            const el = document.getElementById('content');

            try {
                const [tasks, schedData] = await Promise.all([
                    fetch(`${API}/tasks?user=${encodeURIComponent(USER)}`).then(r => r.json()),
                    fetch(`${API}/schedules?user=${encodeURIComponent(USER)}`).then(r => r.json()),
                ]);

                // Tasks due today or overdue
                const urgent = tasks
                    .filter(t => {
                        if (t.completed) return false;
                        const date = t.recurring ? t.nextDue : t.dueDate;
                        return date && date <= today;
                    })
                    .sort((a, b) => (parseInt(a.priority)||99) - (parseInt(b.priority)||99));

                // Today's schedule blocks (cancelled overrides excluded)
                const scheds = (schedData.schedules || [])
                    .filter(s => {
                        if (!isOccurrence(s, today)) return false;
                        const ov = (schedData.overrides || []).find(o =>
                            String(o.scheduleId) === String(s.id) && o.originalDate === today);
                        return !(ov && ov.overrideType === 'cancelled');
                    })
                    .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

                if (urgent.length === 0 && scheds.length === 0) {
                    el.innerHTML = '<div class="empty">✓ All caught up!</div>';
                    return;
                }

                let html = '';
                let shown = 0;

                // Schedule blocks first
                for (const s of scheds) {
                    if (shown >= MAX_ROWS) break;
                    const time = s.startTime
                        ? `<span class="meta-txt">${s.startTime}</span>` : '';
                    html += `<div class="item sched">▸ ${esc(s.name)}${time}</div>`;
                    shown++;
                }

                // Tasks
                for (const t of urgent) {
                    if (shown >= MAX_ROWS) break;
                    html += `<div class="item"><span class="bullet">•</span>${esc(t.name)}</div>`;
                    shown++;
                }

                const rem = (urgent.length + scheds.length) - shown;
                if (rem > 0) html += `<div class="more">+${rem} more</div>`;

                el.innerHTML = html;

            } catch (e) {
                el.innerHTML = '<div class="error">⚠ Could not load data</div>';
            }
        }

        function esc(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        render();
        setInterval(render, 5 * 60 * 1000); // refresh every 5 minutes
    </script>
</body>
</html>
